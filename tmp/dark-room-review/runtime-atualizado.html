<script type="module">
// Test-only instrumentation: the shipped game has no teleport or clock controls.
// Import the real game, exposing its update/render closures only in this page.
import {platforms,phase3Platforms,createBabyState,FLOOR_Y} from '../src/js/config.js';
import {PlatformRenderer,PLATFORM_SURFACES} from '../src/js/environment/PlatformRenderer.js';
import {BabyRenderer} from '../src/js/entities/BabyRenderer.js';
let source=await (await fetch('/src/js/game.js')).text();
source=source.replace(/from '(\.\/.+?)'/g,(_,p)=>`from '${new URL(p,location.origin+'/src/js/game.js')}'`);
const marker='  return {\n    state,\n    audio,';
if(!source.includes(marker))throw Error('Game review instrumentation marker missing');
source=source.replace(marker,`  return {
    review: {
      prepare(index, x, phase3 = false) {
        const p=(phase3 ? phase3Platforms : platforms)[index];
        const y=p ? (p.surfaceTopY ?? p.standRegion?.y ?? p.y) : FLOOR_Y;
        Object.assign(baby,createBabyState(),{x,y:y-44,currentPlatformIndex:index,
          controlsLocked:false,isCrouching:false,respawnLandingPending:false,
          isEscaping:!phase3&&index>=9,longJumpUnlocked:!phase3&&index>=9});
        Object.assign(state,{gameStarted:true,gameWon:false,isGameOver:false,
          isStandbyActive:false,isStandbyTransitioning:false,cutsceneActive:false,
          cutsceneTriggered:true,cutsceneCompleted:index>=9,isEscapeMode:!phase3&&index>=9,
          escapeLevel:Math.max(0,index-9),isPhase3:phase3,phase3Level:Math.max(0,index),phase3TutorialActive:false,plotTwistActive:false,plotTwistTriggered:true,
          firstPlatformCleared:index>=0,truePortalTransitionActive:false,
          cameraX:x-250,cameraY:0,targetCameraY:0,cameraZoom:1,targetCameraZoom:1,
          lastJumpTime:-10000});
        particles.clear();fairy.particles.length=0;
        fairy.x=x+35;fairy.y=y-75;
        state.escapeBannerTimer=0;
        syncStateToLocals();camera.syncFromState(state);
      },
      step(dt=1){update(dt);syncLocalsToState();},
      jump(){lastJumpTime=-10000;doJump();syncLocalsToState();},
      draw(){cameraX=baby.x-350;cameraY=0;cameraZoom=1;
        syncLocalsToState();camera.syncFromState(state);render();}
    },
    state,
    audio,`);
const {createGame}=await import(URL.createObjectURL(new Blob([source],{type:'text/javascript'})));
const game=createGame(document.querySelector('canvas'),document.querySelector('#feedback'));
await game.assetsReady;game.setMuted(true);
const support=p=>({x:p.standRegion?.x??p.x,w:p.standRegion?.w??p.w,y:p.surfaceTopY??p.standRegion?.y??p.y});
window.review={game,platforms,results:[],
  run(target,dt=1,phase3=false){
    const active=phase3?phase3Platforms:platforms;
    const from=target? support(active[target-1]):phase3?{x:4170,w:470,y:FLOOR_Y}:{x:60,w:160,y:FLOOR_Y};
    const leftOverlap=phase3&&target>0?37:0;
    const positions=Array.from({length:Math.floor(from.w)+leftOverlap},(_,i)=>from.x-leftOverlap+i);
    positions.sort((a,b)=>Math.abs(a-(from.x+(from.w-38)/2))-Math.abs(b-(from.x+(from.w-38)/2)));
    for(const x of positions){
      game.review.prepare(target-1,x,phase3);game.review.jump();
      if(game.state.baby.onGround)throw Error('Jump did not start');
      for(let frame=0;frame<220;frame++){
        game.review.step(dt);
        const b=game.state.baby;
        if(game.isGameOver())break;
        if(b.onGround){
          if(b.currentPlatformIndex===target){
            const p=support(active[target]);
            if(Math.abs(b.y+b.h-p.y)>0.001)throw Error('Feet are not on support');
            const result={target,phase:phase3?3:target<10?1:2,style:active[target].style,dt,launchX:x,frames:frame+1,feet:b.y+b.h,surface:p.y};
            this.results.push(result);game.review.draw();return result;
          }break;
        }
      }
    }
    throw Error('No successful real-game jump to '+target+' '+active[target].style);
  },
  contacts(index,dt=1){
    const s=support(platforms[index]);
    const cases=[['left',s.x],['center',s.x+(s.w-38)/2],['right',s.x+s.w-38]];
    for(const [name,x] of cases){
      game.review.prepare(index,x);
      const b=game.state.baby;
      Object.assign(b,{y:s.y-b.h-60,vy:0,vx:0,onGround:false});
      let landed=false;
      for(let frame=0;frame<120;frame++){
        b.vx=0;game.review.step(dt);
        if(b.onGround){
          if(b.currentPlatformIndex!==index)throw Error(`${index}: ${name} landed on wrong platform`);
          if(Math.abs(b.y+b.h-s.y)>0.001)throw Error(`${index}: ${name} feet mismatch`);
          landed=true;break;
        }
      }
      if(!landed)throw Error(`${index}: ${name} drop failed`);
      for(let frame=0;frame<8;frame++){
        b.vx=0;game.review.step(dt);
        if(!b.onGround||Math.abs(b.y+b.h-s.y)>0.001)throw Error(`${index}: unstable ${name} support`);
      }
    }
    return {target:index,dt,drops:3,stableFrames:8};
  },
  visibleSupport(index){
    const p=platforms[index],s=support(p),calibration=PLATFORM_SURFACES[p.style];
    if(!calibration?.cap)return {checked:false};
    const canvas=document.createElement('canvas');canvas.width=512;canvas.height=512;
    const ctx=canvas.getContext('2d'),renderer=new PlatformRenderer({assets:game.assets});
    const previous=window.DEBUG_COLLISIONS;window.DEBUG_COLLISIONS=false;
    try {
      ctx.save();ctx.translate(100-s.x,120-s.y);
      renderer.renderPlatforms(ctx,{width:10000},0,{platforms:[p]});ctx.restore();
      const pixels=ctx.getImageData(100,120,s.w,1).data;
      for(let x=0;x<s.w;x++)if(pixels[x*4+3]!==255){
        throw Error(`${index}: transparent visual support at x=${x}`);
      }
      // Check removed atlas fragments on an otherwise transparent canvas.
      const scale=s.w/calibration.surfaceW;
      const dw=Math.round(calibration.origW*scale),dh=Math.round(calibration.origH*scale);
      const dx=Math.round(100-calibration.surfaceX*scale),dy=Math.round(120-calibration.surfaceY*scale);
      for(const [x,y,w,h] of calibration.excludeRects||[]){
        const px=Math.floor(dx+(x+w/2)*dw/calibration.origW);
        const py=Math.floor(dy+(y+h/2)*dh/calibration.origH);
        if(ctx.getImageData(px,py,1,1).data[3]!==0)throw Error(`${index}: atlas fragment still visible`);
      }
      return {checked:true,opaqueSupportPixels:s.w,excludedFragments:calibration.excludeRects?.length||0};
    } finally {window.DEBUG_COLLISIONS=previous;}
  },
  detail(index){
    const p=platforms[index],s=support(p),canvas=document.createElement('canvas');
    canvas.width=960;canvas.height=400;
    const ctx=canvas.getContext('2d'),renderer=new PlatformRenderer({assets:game.assets});
    const character=new BabyRenderer(),previous=window.DEBUG_COLLISIONS;
    window.DEBUG_COLLISIONS=false;
    try {
      for(const [i,[label,x]] of [['Esquerda',s.x],['Centro',s.x+(s.w-38)/2],['Direita',s.x+s.w-38]].entries()){
        ctx.save();ctx.beginPath();ctx.rect(i*320,0,320,400);ctx.clip();
        ctx.fillStyle='#211b2d';ctx.fillRect(i*320,0,320,400);
        ctx.fillStyle='#fff';ctx.font='14px sans-serif';ctx.fillText(`${index}: ${p.style} — ${label}`,i*320+12,24);
        ctx.translate(i*320+160-s.x-s.w/2,120-s.y);
        renderer.renderPlatforms(ctx,{width:10000},0,{platforms:[p]});
        const b={...createBabyState(),x,y:s.y-44,animTime:0,onGround:true};
        character.render(ctx,b);
        // Mark only the ends, leaving the actual shoe/object contact visible.
        ctx.strokeStyle='#4ade80';ctx.lineWidth=1;
        for(const edge of [s.x,s.x+s.w]){
          ctx.beginPath();ctx.moveTo(edge,s.y-6);ctx.lineTo(edge,s.y+8);ctx.stroke();
        }
        ctx.restore();
      }
      return canvas.toDataURL('image/png').split(',')[1];
    } finally {window.DEBUG_COLLISIONS=previous;}
  },
  show(index,debug=false){const s=support(platforms[index]);game.review.prepare(index,s.x+(s.w-38)/2);
    game.state.baby.vx=0;window.DEBUG_COLLISIONS=debug;game.review.draw();}
};
document.body.dataset.ready='true';
// Optional headless review entry point: exercise the actual update loop and
// show contact close-ups without adding debug controls to the shipped game.
if (new URLSearchParams(location.search).has('verify')) {
  try {
    for (const dt of [0.5, 1, 1.2]) {
      for (let target=0; target<=21; target++) window.review.run(target,dt);
      for (let target=0; target<=15; target++) window.review.run(target,dt,true);
      game.review.prepare(9,1631);
      for (let frame=0; frame<300; frame++) {
        game.review.step(dt);
        const b=game.state.baby;
        if (!b.onGround || b.x!==1631 || b.y!==192 || b.vx!==0)
          throw Error(`Castle pause failed at dt=${dt}, frame=${frame}`);
      }
      game.review.jump();
      for(let frame=0;frame<240 && !game.state.baby.onGround;frame++) game.review.step(dt);
      if(game.state.baby.currentPlatformIndex!==10)throw Error('Castle jump missed train');
    }
    const gallery=document.createElement('div');
    for (const index of [10,11,12]) {
      const img=new Image();img.src='data:image/png;base64,'+window.review.detail(index);
      img.style.width='960px';img.style.display='block';gallery.append(img);
    }
    document.querySelector('canvas').remove();document.body.prepend(gallery);
    document.querySelector('#feedback').textContent='PASS: real updates, 114 jumps and 900 castle pause frames';
    document.body.dataset.result='passed';
  } catch(error) {
    document.body.dataset.result='failed';
    document.querySelector('#feedback').textContent=error.stack;
  }
}
