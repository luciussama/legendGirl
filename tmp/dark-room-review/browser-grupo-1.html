<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><base href="/"><title>Revisão artística</title><style>body{margin:12px;background:#211b2d;color:#eee;font:14px sans-serif}main{display:grid;grid-template-columns:480px 480px;gap:8px}canvas{background:#292237}h1{font-size:20px}</style></head><body ><h1>Revisão artística — linha verde: apoio físico preservado</h1><main></main><pre id="status">Concluído: 38 plataformas, 3 momentos de animação.</pre><script type="module">
import {platforms,phase3Platforms,createBabyState} from '/src/js/config.js';
import {PlatformRenderer} from '/src/js/environment/PlatformRenderer.js';
import {BabyRenderer} from '/src/js/entities/BabyRenderer.js';
import {AssetManager} from '/src/js/assets/AssetManager.js';
try {
const assets=new AssetManager();await assets.loadManifest();await assets.preload();
const renderer=new PlatformRenderer({assets}), character=new BabyRenderer();
const entries=[...platforms.map((p,index)=>({p,index,phase:index<10?1:2})),...phase3Platforms.map((p,index)=>({p,index,phase:3}))];
const metrics=[];const group=Number(new URLSearchParams(location.search).get('group')||0);
for(let entry=0;entry<entries.length;entry++){
 const {p,index,phase}=entries[entry],s={x:p.standRegion?.x??p.x,y:p.surfaceTopY??p.standRegion?.y??p.y,w:p.standRegion?.w??p.w};
 const samples=[];
 for(const tick of [0,8,24]) {
 const mask=document.createElement('canvas');mask.width=900;mask.height=640;const m=mask.getContext('2d',{willReadFrequently:true});
 m.translate(350-s.x,200-s.y);renderer.renderPlatforms(m,{width:20000},0,{platforms:[{...p,x:p.x+10000,standRegion:p.standRegion?{...p.standRegion,x:p.standRegion.x+10000}:undefined}],isPhase3:phase===3,assets,tick});
 // Render again in local camera coordinates, including negative world positions.
 m.setTransform(1,0,0,1,0,0);m.clearRect(0,0,900,640);m.translate(0,200-s.y);
 renderer.renderPlatforms(m,mask,s.x-350,{platforms:[p],isPhase3:phase===3,assets,tick});
 const pixels=m.getImageData(0,0,900,640).data;
 const alpha=(x,y)=>pixels[(y*900+x)*4+3];const columns=[];
 for(let k=0;k<s.w;k++) {let nearest=null;for(let d=0;d<=32&&nearest===null;d++)for(const dy of d?[d,-d]:[0])if(alpha(350+k,200+dy)>=128){nearest=dy;break;}columns.push(nearest);}
 const near=columns.filter(v=>v!==null&&Math.abs(v)<=1).length;
 samples.push({tick,coverageWithin1pxPct:100*near/s.w,noOpaqueWithin32px:columns.filter(v=>v===null).length,nearestOpaqueOffsets:columns});
 }
 metrics.push({phase,index,style:p.style,support:s,samples});
 if(Math.floor(entry/10)!==group)continue;
 const canvas=document.createElement('canvas');canvas.width=480;canvas.height=310;const c=canvas.getContext('2d');document.querySelector('main').append(canvas);
 c.fillStyle='#fff';c.font='14px sans-serif';c.fillText(`F${phase} / ${index}: ${p.style}`,12,20);
 c.save();c.translate(0,115-s.y);const camera=s.x+s.w/2-240;
 renderer.renderPlatforms(c,canvas,camera,{platforms:[p],isPhase3:phase===3,assets,tick:0});
 const baby={...createBabyState(),x:s.x+(s.w-38)/2-camera,y:s.y-44,onGround:true,facing:phase===3?-1:1,animTime:0};character.render(c,baby);
 c.strokeStyle='#4ade80';c.lineWidth=1;c.beginPath();c.moveTo(s.x-camera,s.y);c.lineTo(s.x+s.w-camera,s.y);c.stroke();c.restore();
 c.fillStyle='#fff';c.fillText(`Apoio x=${s.x}..${s.x+s.w}; y=${s.y}`,12,284);
 c.fillText(`Pixels junto ao apoio: ${samples[0].coverageWithin1pxPct.toFixed(1)}%`,12,302);
}
document.querySelector('#status').textContent='Concluído: 38 plataformas, 3 momentos de animação.';
const out=document.createElement('script');out.id='audit-data';out.type='application/json';out.textContent=JSON.stringify(metrics);document.body.append(out);document.body.dataset.result='passed';
}catch(e){document.querySelector('#status').textContent=e.stack;document.body.dataset.result='failed';}
</script></body></html>
