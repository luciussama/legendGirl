<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fadinha — primeira fase</title><style>body{margin:24px auto;padding:0 20px;max-width:1450px;background:#17121f;color:#f8eddb;font:16px/1.5 system-ui}a{color:#ffd584}select{padding:10px;font:inherit;background:#302839;color:#f8eddb;border:1px solid #b99454;border-radius:6px;margin:6px}.par{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:12px 0}img{max-width:100%;height:auto}figcaption{margin-bottom:8px}@media(max-width:650px){.par{grid-template-columns:1fr}}</style><h1>Fadinha — primeira fase</h1><p>Mesmo PNG aprovado no mundo e nos retratos. Três percursos completos aprovados; asas e expressão permanecem estáticas.</p><p><a href="RELATORIO.md">Relatório e limites do playtest</a></p><label>Enquadramento <select id="profile"><option value="desktop">Desktop</option><option value="android">Retrato</option><option value="landscape">Paisagem</option></select></label><label>Cena <select id="scene"></select></label><div class="par"><figure><figcaption>Antes</figcaption><a id="linkBefore"><img id="before" alt="Fadinha anterior"></a></figure><figure><figcaption>Depois</figcaption><a id="linkAfter"><img id="after" alt="Fadinha ilustrada no mesmo estado"></a></figure></div><p>Algumas trajetórias aproximam a fada da cabeça da menina. Essa composição permanece registrada.</p><script>const states={"desktop": ["abertura-0", "abertura-6", "abertura-12", "abertura-18", "abertura-24", "abertura-30", "abertura-36", "tutorial-primeiro-salto", "cinematica-1", "cinematica-2", "revelacao-1", "revelacao-2", "revelacao-3", "revelacao-4", "revelacao-5", "tutorial-retorno", "portal"], "android": ["abertura-0", "abertura-6", "abertura-12", "abertura-18", "abertura-24", "abertura-30", "abertura-36", "tutorial-primeiro-salto", "cinematica-1", "cinematica-2", "revelacao-1", "revelacao-2", "revelacao-3", "revelacao-4", "revelacao-5", "tutorial-retorno", "portal"], "landscape": ["abertura-0", "abertura-6", "abertura-12", "abertura-18", "abertura-24", "abertura-30", "abertura-36", "tutorial-primeiro-salto", "cinematica-1", "cinematica-2", "revelacao-1", "revelacao-2", "revelacao-3", "revelacao-4", "revelacao-5", "tutorial-retorno", "portal"]};const profile=document.getElementById('profile'),scene=document.getElementById('scene');function show(){const prefix=profile.value+'/'+scene.value;document.getElementById('before').src=prefix+'-antes.png';document.getElementById('after').src=prefix+'-depois.png';document.getElementById('linkBefore').href=prefix+'-antes.png';document.getElementById('linkAfter').href=prefix+'-depois.png'}function options(){scene.replaceChildren(...states[profile.value].map(value=>{const option=document.createElement('option');option.value=value;option.textContent=value.replaceAll('-',' ');return option}));scene.value='cinematica-2';show()}profile.onchange=options;scene.onchange=show;options();</script></html>
