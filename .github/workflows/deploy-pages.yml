name: Publicação no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código do repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar dependências
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --package-lock=true
          fi
      - name: Validar projeto
        run: |
          npm run check-assets
          npm run lint
          npm test
          node scripts/test-opening-sequence.js
          node scripts/test-lighting.js
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar site estático
        run: npm run build
      - name: Verificar site e pacote de download
        run: |
          node scripts/test-pages-build.js
          unzip -t _site/o-quarto-dos-brinquedos.zip > /dev/null
      - name: Enviar site estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
